[package]
name = "shelly"
version = "0.0.4"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
confy = "2.0.0"
console = "0.15"
dialoguer = { version = "0.12.0", features = [
  "completion",
  "fuzzy-matcher",
  "fuzzy-select",
  "history",
] }
serde = "1.0.228"
serde_derive = "1.0.228"
tokio = { version = "1", features = ["full"] }
async-openai = { version = "0.36.1", features = ["chat-completion", "rustls"] }
async-trait = "0.1"
urlencoding = "2.1"
reqwest = { version = "0.12", features = [
  "rustls-tls",
  "json",
], default-features = false }
indicatif = "0.17"
dirs = "6.0.0"
serde_json = "1.0.149"
handlebars = "6.4.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
mockall = "0.12"
tempfile = "3.10"

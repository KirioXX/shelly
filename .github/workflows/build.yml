name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-build:
    name: Release Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: tar czvf shelly-${{ matrix.os }}-${SHORT_SHA}.tar.gz -C target/release shelly

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/release/shelly.exe -DestinationPath shelly-${{ matrix.os }}-$env:SHORT_SHA.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelly-${{ matrix.os }}
          path: |
            shelly-${{ matrix.os }}*.*
          if-no-files-found: error
